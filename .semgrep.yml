rules:
  - id: no-eval
    pattern: eval($X)
    message: Using eval is dangerous
    severity: ERROR
    languages: [javascript, typescript]

  - id: no-innerhtml
    pattern: $EL.innerHTML = $X
    message: Assignment to innerHTML can lead to XSS if input is untrusted
    severity: ERROR
    languages: [javascript, typescript]

  - id: no-document-write
    pattern: document.write($X)
    message: document.write can lead to XSS vulnerabilities
    severity: WARNING
    languages: [javascript, typescript]

  - id: sensitive-localstorage
    pattern: localStorage.setItem($K, $V)
    message: Be careful storing sensitive data in localStorage
    severity: WARNING
    languages: [javascript, typescript]